
name: SecureCloudOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securecloudops
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d securecloudops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app_user:local_dev_only@localhost:5432/securecloudops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t securecloudops-api:${GITHUB_SHA} .

  oidc-check:
    name: Verify GitHub OIDC access to AWS
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: securecloudops-oidc-check

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  deploy:
    name: Deploy to EC2 through SSM
    needs: [ci, oidc-check]
    runs-on: ubuntu-latest

    if: >-
      vars.ENABLE_EC2_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: securecloudops-deploy-${{ github.run_id }}

      - name: Deploy through Systems Manager
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Set EC2_INSTANCE_ID in repository variables}"

          REMOTE_SCRIPT="$(sed "s/__DEPLOY_SHA__/${GITHUB_SHA}/g" .github/scripts/deploy-ec2.sh)"
          PARAMETERS="$(jq -n --arg script "$REMOTE_SCRIPT" '{commands: [$script]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy SecureCloudOps ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json || true

          echo "Timed out waiting for the SSM command."
          exit 1
