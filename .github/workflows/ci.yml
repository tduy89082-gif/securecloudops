
name: SecureCloudOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Docker image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securecloudops
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d securecloudops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app_user:local_dev_only@localhost:5432/securecloudops

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t securecloudops-api:${GITHUB_SHA} .

      - name: Show Docker and database logs on failure
        if: failure()
        run: |
          docker ps -a
          docker image ls
