name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securecloudops
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user -d securecloudops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app_user:local_dev_only@localhost:5432/securecloudops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
