services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securecloudops
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d securecloudops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:local_dev_only@db:5432/securecloudops
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
